<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DBZ Tournament</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dbz-orange: #F85B1A;
            --dbz-blue: #072083;
            --dbz-yellow: #F7D02C;
            --dbz-dark: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle, #2a2a2a 0%, #000000 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px var(--dbz-blue);
        }

        h1 { color: var(--dbz-yellow); font-size: 3rem; margin-bottom: 30px; text-align: center; line-height: 1.1; }
        h2 { color: var(--dbz-orange); font-size: 2rem; margin-bottom: 20px; text-align: center; }

        .screen { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }

        .btn {
            background: var(--dbz-orange);
            color: white;
            border: 3px solid var(--dbz-yellow);
            padding: 15px 30px;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 5px 0 #b33e00;
        }

        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b33e00; }
        .btn-blue { background: var(--dbz-blue); border-color: #4169E1; box-shadow: 0 5px 0 #04124d; }
        .btn-blue:active { box-shadow: 0 1px 0 #04124d; }
        .btn-small { padding: 8px 15px; font-size: 1rem; width: auto; margin: 5px; }
        .btn-green { background: #28a745; border-color: #34ce57; box-shadow: 0 5px 0 #1e7e34; font-size: 1rem; }

        .card {
            background: linear-gradient(135deg, var(--dbz-orange), #ff8c00);
            border: 3px solid var(--dbz-yellow);
            border-radius: 12px;
            padding: 20px;
            margin: 10px 0;
            width: 100%;
            text-align: center;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            color: white;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            box-shadow: 0 6px 0 #b33e00, 0 10px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.2;
        }

        .card:active { transform: scale(0.98); }
        .card-controls { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }

        .input-group { display: flex; width: 100%; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 3px solid var(--dbz-blue);
            border-radius: 10px;
            font-size: 1.2rem;
            font-family: 'Roboto', sans-serif;
            background: #fff;
            color: var(--dbz-dark);
        }

        .vs-text {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            color: var(--dbz-yellow);
            text-shadow: 4px 4px 0px var(--dbz-blue);
            margin: 15px 0;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.1);
            border-left: 5px solid var(--dbz-yellow);
            padding: 12px 15px;
            margin: 6px 0;
            width: 100%;
            border-radius: 5px;
            gap: 10px;
        }
        .rank-number { font-family: 'Bangers'; font-size: 1.6rem; color: var(--dbz-orange); min-width: 45px; }
        .rank-name { flex: 1; text-align: left; font-weight: bold; font-size: 1.1rem; line-height: 1.2; }
        .rank-stats { text-align: right; font-size: 0.95rem; white-space: nowrap; line-height: 1.3; }

        .winner-aura {
            animation: super-saiyan 1.5s infinite alternate;
            font-size: 2rem !important;
        }
        @keyframes super-saiyan {
            0% { box-shadow: 0 0 10px var(--dbz-yellow), 0 0 20px var(--dbz-orange); border-color: var(--dbz-yellow); }
            100% { box-shadow: 0 0 20px var(--dbz-yellow), 0 0 40px var(--dbz-orange), 0 0 60px white; border-color: white; }
        }
    </style>
</head>
<body>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="main-screen" class="screen active">
        <h1>DRAGON BALL<br>TOURNAMENT</h1>
        <button class="btn" onclick="showScreen('edit-screen')">⚙️ РЕДАКТИРОВАТЬ</button>
        <button class="btn btn-blue" onclick="startTournament()">🔥 ИГРАТЬ</button>
    </div>

    <!-- ЭКРАН РЕДАКТИРОВАНИЯ -->
    <div id="edit-screen" class="screen">
        <h2>Участники</h2>
        <div class="input-group">
            <input type="text" id="new-participant" placeholder="Имя бойца / Книга..." maxlength="40">
            <button class="btn btn-small" onclick="addParticipant()">+</button>
        </div>
        <button class="btn btn-small btn-green" onclick="resetToDefaultBooks()" style="width: 100%; margin-bottom: 15px;">📚 Загрузить список книг по умолчанию</button>
        <div id="participants-list" style="width: 100%;"></div>
        <button class="btn btn-blue" onclick="showScreen('main-screen')" style="margin-top: 20px;">← НАЗАД</button>
    </div>

    <!-- ЭКРАН ИГРЫ -->
    <div id="play-screen" class="screen">
        <h2 id="round-indicator">Раунд 1</h2>
        <div id="battle-area" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <!-- Карточки бойцов появятся здесь -->
        </div>
        <button class="btn btn-small" onclick="showScreen('main-screen')" style="margin-top: 30px; background: #555; border-color: #777; box-shadow: 0 5px 0 #333;">СДАТЬСЯ (В меню)</button>
    </div>

    <!-- ЭКРАН РЕЗУЛЬТАТОВ -->
    <div id="result-screen" class="screen">
        <h1>ПОБЕДИТЕЛЬ!</h1>
        <div id="winner-card" class="card winner-aura" style="margin-bottom: 30px;"></div>
        <h2>ТОП БОЙЦОВ</h2>
        <div id="ranking-list" style="width: 100%;"></div>
        <button class="btn" onclick="showScreen('main-screen')" style="margin-top: 20px;">В ГЛАВНОЕ МЕНЮ</button>
    </div>

    <script>
        // --- ДАННЫЕ И СОСТОЯНИЕ ---
        const defaultBooks = ['Жук в муравейнике', 'Страдания молодого Вертера', 'Леди Макбет Мценского уезда', 'у меня нет рта но я должен кричать', 'О мышах и людях', 'Скотный двор', 'Завтрак у Тиффани', 'Великий Гэтсби', 'Повелитель мух', 'Хан Ган - Человеческие поступки', 'Кормак Маккарти - Дорога', 'Чапаев и Пустота (Пелевин)', 'Любовница смерти (Акунин)', 'Клуб самоубийц', 'черный обелиск(не смотрите количество страниц, не смотрите количество страниц)'];

        let participants = JSON.parse(localStorage.getItem('dbz_participants')) || [...defaultBooks];
        let tournamentPool = [];
        let nextRoundPool = [];
        let eliminated = [];
        let currentRound = 1;
        let editingIndex = -1;
        let currentFighters = [];

        // --- УПРАВЛЕНИЕ ЭКРАНАМИ ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'edit-screen') renderParticipantsList();
        }

        // --- ЛОГИКА РЕДАКТИРОВАНИЯ ---
        function saveParticipants() {
            localStorage.setItem('dbz_participants', JSON.stringify(participants));
        }

        function resetToDefaultBooks() {
            if(confirm('Заменить текущий список на список книг по умолчанию?')) {
                participants = [...defaultBooks];
                saveParticipants();
                renderParticipantsList();
            }
        }

        function renderParticipantsList() {
            const list = document.getElementById('participants-list');
            list.innerHTML = '';
            participants.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.style.fontSize = '1.25rem';
                div.style.padding = '15px';
                div.innerHTML = `
                    ${editingIndex === index ? 
                        `<input type="text" id="edit-input-${index}" value="${p}" style="width: 100%; font-size: 1.1rem; padding: 8px; margin-bottom: 10px;">` : 
                        `<span>${p}</span>`
                    }
                    <div class="card-controls">
                        ${editingIndex === index ? 
                            `<button class="btn btn-small" onclick="saveEdit(${index})">💾</button>` : 
                            `<button class="btn btn-small" onclick="startEdit(${index})">✏️</button>`
                        }
                        <button class="btn btn-small" style="background: #cc0000;" onclick="deleteParticipant(${index})">🗑️</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function addParticipant() {
            const input = document.getElementById('new-participant');
            const name = input.value.trim();
            if (name) {
                participants.push(name);
                input.value = '';
                saveParticipants();
                renderParticipantsList();
            }
        }

        function startEdit(index) {
            editingIndex = index;
            renderParticipantsList();
        }

        function saveEdit(index) {
            const newName = document.getElementById(`edit-input-${index}`).value.trim();
            if (newName) {
                participants[index] = newName;
                editingIndex = -1;
                saveParticipants();
                renderParticipantsList();
            }
        }

        function deleteParticipant(index) {
            if(confirm('Удалить этого участника?')) {
                participants.splice(index, 1);
                editingIndex = -1;
                saveParticipants();
                renderParticipantsList();
            }
        }

        // --- ЛОГИКА ТУРНИРА ---
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startTournament() {
            if (participants.length < 2) {
                alert('Нужно минимум 2 участника для турнира! Добавь их в редакторе.');
                return;
            }
            tournamentPool = shuffle([...participants]);
            nextRoundPool = [];
            eliminated = [];
            currentRound = 1;
            showScreen('play-screen');
            nextBattle();
        }

        function nextBattle() {
            const battleArea = document.getElementById('battle-area');
            battleArea.innerHTML = '';

            // Если текущий пул пуст, проверяем, кто прошел в следующий раунд
            if (tournamentPool.length === 0) {
                if (nextRoundPool.length === 1) {
                    // Остался только один человек во всем турнире - это ПОБЕДИТЕЛЬ!
                    eliminated.unshift({ name: nextRoundPool[0], round: currentRound });
                    showResults();
                    return;
                } else if (nextRoundPool.length > 1) {
                    // Раунд завершен, готовим следующий раунд
                    tournamentPool = shuffle([...nextRoundPool]);
                    nextRoundPool = [];
                    currentRound++;
                    nextBattle();
                    return;
                }
            }

            // Берем первого бойца из текущей пары
            const fighter1 = tournamentPool.shift();

            // Если после этого пул пуст, этому бойцу достается "бай-бай" (автоматический проход)
            if (tournamentPool.length === 0) {
                nextRoundPool.push(fighter1);
                nextBattle();
                return;
            }

            // Иначе берем второго бойца для полноценной пары
            const fighter2 = tournamentPool.shift();
            currentFighters = [fighter1, fighter2];

            // Отрисовка боя
            document.getElementById('round-indicator').innerText = `РАУНД ${currentRound}`;
            battleArea.innerHTML = `
                <div class="card" onclick="resolveBattle(0)">${fighter1}</div>
                <div class="vs-text">VS</div>
                <div class="card" onclick="resolveBattle(1)">${fighter2}</div>
                <p style="margin-top: 20px; color: #aaa; font-size: 0.9rem;">Нажми на победителя!</p>
            `;
        }

        function resolveBattle(winnerIndex) {
            const winner = currentFighters[winnerIndex];
            const loser = currentFighters[winnerIndex === 0 ? 1 : 0];
            
            nextRoundPool.push(winner);
            eliminated.push({ name: loser, round: currentRound });
            nextBattle();
        }

        // --- ЛОГИКА РЕЗУЛЬТАТОВ (ИСПРАВЛЕННАЯ) ---
        function showResults() {
            showScreen('result-screen');
            
            // 1. Отделяем победителя (он всегда первый в массиве eliminated благодаря unshift)
            const winner = eliminated.shift();
            winner.isWinner = true;
            
            // 2. Сортируем остальных выбывших по убыванию раунда (кто дольше продержался - тот выше)
            eliminated.sort((a, b) => b.round - a.round);
            
            // 3. Возвращаем победителя на первое место
            eliminated.unshift(winner);
            
            // 4. Отрисовка
            document.getElementById('winner-card').innerText = winner.name;
            
            const rankList = document.getElementById('ranking-list');
            rankList.innerHTML = '';
            
            eliminated.forEach((fighter, index) => {
                // Расчет очков: у победителя = раунд победы + 1, у остальных = раунд вылета
                const points = fighter.isWinner ? fighter.round + 1 : fighter.round;
                
                const div = document.createElement('div');
                div.className = 'rank-item';
                div.innerHTML = `
                    <span class="rank-number">#${index + 1}</span>
                    <span class="rank-name">${fighter.name}</span>
                    <span class="rank-stats">
                        Раунд: ${fighter.round}<br>
                        <strong style="color: var(--dbz-yellow); font-size: 1.1rem;">Очки: ${points}</strong>
                    </span>
                `;
                rankList.appendChild(div);
            });
        }
    </script>
</body>
</html>
